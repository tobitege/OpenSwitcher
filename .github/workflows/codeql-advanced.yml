name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '28 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The WinUI app only builds on Windows.
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-24.04
          - language: csharp
            build-mode: manual
            os: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        env:
          # Overlay databases require build-mode none for C#; retain the real build.
          CODEQL_OVERLAY_DATABASE_MODE: ${{ matrix.language == 'csharp' && 'none' || '' }}
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: true

      - name: Build app and tests for CodeQL extraction
        if: matrix.language == 'csharp'
        run: |
          dotnet build src/OpenSwitcher/OpenSwitcher.csproj -c Release -r win-x64
          dotnet build tests/OpenSwitcher.Core.Tests/OpenSwitcher.Core.Tests.csproj -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
